<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pyuron Keymap Cheatsheet</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7f9;
      --surface: #ffffff;
      --surface-soft: #f0f3f7;
      --text: #1d2430;
      --muted: #6b7280;
      --line: #d7dde7;
      --key: #fbfcfe;
      --key-text: #172033;
      --transparent: #eef1f5;
      --letter: #e9f7f2;
      --mod: #edf2ff;
      --layer: #fff4d8;
      --system: #ffe8e5;
      --mouse: #f1e8ff;
      --accent: #0f766e;
      --shadow: 0 10px 30px rgb(31 41 55 / 10%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111418;
        --surface: #1b2027;
        --surface-soft: #242a33;
        --text: #edf1f7;
        --muted: #a6afbd;
        --line: #343c49;
        --key: #242b34;
        --key-text: #f6f8fb;
        --transparent: #191e25;
        --letter: #123a32;
        --mod: #182849;
        --layer: #46370e;
        --system: #4b201d;
        --mouse: #2e2145;
        --shadow: 0 10px 30px rgb(0 0 0 / 24%);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    main {
      width: min(1760px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 18px 0 28px;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      padding: 5px 10px;
      white-space: nowrap;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: color-mix(in srgb, var(--surface) 92%, transparent);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }

    .segmented {
      display: inline-grid;
      grid-auto-flow: column;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: var(--surface);
    }

    button {
      min-height: 34px;
      border: 0;
      border-right: 1px solid var(--line);
      background: transparent;
      color: var(--text);
      padding: 7px 12px;
      font: inherit;
      cursor: pointer;
    }

    button:last-child {
      border-right: 0;
    }

    button[aria-pressed="true"] {
      background: var(--accent);
      color: white;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-left: auto;
      color: var(--muted);
      font-size: 12px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .swatch {
      width: 14px;
      height: 14px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--key);
    }

    .swatch.letter { background: var(--letter); }
    .swatch.mod { background: var(--mod); }
    .swatch.layer { background: var(--layer); }
    .swatch.system { background: var(--system); }
    .swatch.mouse { background: var(--mouse); }

    .layers {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 680px), 1fr));
      gap: 14px;
    }

    .layer-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .layer-card.is-hidden {
      display: none;
    }

    .layer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px 8px;
      border-bottom: 1px solid var(--line);
    }

    .layer-title {
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-width: 0;
    }

    h2 {
      margin: 0;
      font-size: 16px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .layer-note {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .board-scroll {
      overflow-x: auto;
      padding: 12px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(13, minmax(42px, 1fr));
      grid-template-rows: repeat(4, 56px);
      gap: 6px;
      min-width: 720px;
    }

    .key {
      display: flex;
      min-width: 0;
      flex-direction: column;
      justify-content: center;
      align-items: stretch;
      gap: 2px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--key);
      color: var(--key-text);
      padding: 5px;
      overflow: hidden;
    }

    .key.transparent {
      background: var(--transparent);
      color: var(--muted);
      opacity: .68;
    }

    .key.letter { background: var(--letter); }
    .key.mod { background: var(--mod); }
    .key.layer { background: var(--layer); }
    .key.system { background: var(--system); }
    .key.mouse { background: var(--mouse); }

    .hide-transparent .key.transparent {
      visibility: hidden;
    }

    .primary {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: 0;
    }

    .primary.long {
      white-space: normal;
      overflow-wrap: anywhere;
      font-size: 11px;
      line-height: 1.05;
    }

    .primary.combo {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2px;
      white-space: normal;
      overflow: hidden;
      text-overflow: clip;
    }

    .combo-token {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      border: 1px solid color-mix(in srgb, var(--line) 75%, var(--key-text));
      border-radius: 4px;
      background: color-mix(in srgb, var(--surface) 70%, transparent);
      padding: 1px 3px;
      font-size: 9px;
      font-weight: 750;
      line-height: 1.1;
    }

    .secondary {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1px 3px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: normal;
      color: var(--muted);
      font-size: 9px;
      line-height: 1.05;
      letter-spacing: 0;
      text-align: center;
    }

    .hint-action {
      color: color-mix(in srgb, var(--muted) 80%, var(--text));
      font-size: 8px;
      font-weight: 650;
    }

    .hint-value {
      overflow-wrap: anywhere;
      font-weight: 650;
    }

    .wide .layers {
      grid-template-columns: 1fr;
    }

    .wide .board {
      grid-template-columns: repeat(13, minmax(58px, 1fr));
      grid-template-rows: repeat(4, 68px);
      min-width: 900px;
    }

    .wide .primary {
      font-size: 15px;
    }

    .wide .primary.long {
      font-size: 13px;
    }

    .wide .combo-token {
      font-size: 10px;
      padding-inline: 4px;
    }

    .wide .secondary {
      font-size: 10px;
    }

    .image-export {
      background: #f6f7f9;
      color-scheme: light;
    }

    .image-export main {
      width: 1280px;
      padding: 24px;
    }

    .image-export .toolbar {
      display: none;
    }

    .image-export .layers {
      grid-template-columns: 1fr;
    }

    .image-export .board-scroll {
      overflow-x: visible;
    }

    .image-export .board {
      grid-template-columns: repeat(13, minmax(0, 1fr));
      min-width: 0;
      width: 100%;
    }

    .image-export .layer-card,
    .image-export .pill {
      box-shadow: none;
    }

    @media (max-width: 760px) {
      main {
        width: min(100vw - 18px, 1760px);
        padding-top: 10px;
      }

      header {
        display: block;
      }

      .meta {
        justify-content: flex-start;
        margin-top: 8px;
      }

      .toolbar {
        align-items: stretch;
      }

      .segmented {
        width: 100%;
      }

      button {
        width: 100%;
        padding-inline: 8px;
      }

      .legend {
        margin-left: 0;
      }
    }
  </style>
</head>
<body>
  <main id="app">
    <header>
      <h1>Pyuron Keymap</h1>
      <div class="meta">
        <span class="pill">40 keys</span>
        <span class="pill">7 layers</span>
        <span class="pill">combo Q + W -> Esc (MAC_BASE, WIN_BASE), H + J -> Win (WIN_BASE), O + P -> Right Ctrl (WIN_BASE), P + Esc -> To Mac (all layers)</span>
      </div>

    <section class="toolbar" aria-label="表示">

        <button type="button" data-filter="utility" aria-pressed="false">Utility</button>

      <div class="segmented" aria-label="表示密度">
        <button type="button" data-density="compact" aria-pressed="true">Compact</button>
        <button type="button" data-density="wide" aria-pressed="false">Wide</button>
      </div>
      <div class="segmented" aria-label="透過キー">
        <button type="button" data-trans="show" aria-pressed="true">trns</button>
        <button type="button" data-trans="hide" aria-pressed="false">Hide</button>
      </div>
      <div class="legend" aria-label="凡例">
        <span class="legend-item"><span class="swatch letter"></span>letters</span>
        <span class="legend-item"><span class="swatch mod"></span>mods</span>
        <span class="legend-item"><span class="swatch layer"></span>layers</span>
        <span class="legend-item"><span class="swatch system"></span>system</span>
        <span class="legend-item"><span class="swatch mouse"></span>mouse</span>
      </div>
    </section>

    <section class="layers" id="layers" aria-label="キーマップ"></section>
  </main>

    function renderLabel(container, primary) {
      const isCombo = primary.length > 1 && primary.includes("+");
      container.textContent = "";
      container.classList.toggle("combo", isCombo);
      container.classList.toggle("long", primary.length > 9 && !isCombo);

      if (!isCombo) {
        container.textContent = primary;
        return;
      }

      for (const token of primary.split("+")) {
        const item = document.createElement("span");
        item.className = "combo-token";
        item.textContent = token;
        container.append(item);
      }
    }

    function renderHint(container, hint) {
      container.textContent = "";
      if (!hint) return;

      const [action, ...rest] = hint.split(" ");
      const value = rest.join(" ");
      if (!value) {
        container.textContent = hint;
        return;
      }

      const actionItem = document.createElement("span");
      actionItem.className = "hint-action";
      actionItem.textContent = action;
      container.append(actionItem);

      const valueItem = document.createElement("span");
      valueItem.className = "hint-value";
      valueItem.textContent = value;
      container.append(valueItem);
    }

    function render() {
      layersContainer.innerHTML = "";
      for (const layer of layers) {
        const card = document.createElement("article");
        card.className = "layer-card";
        card.dataset.group = layer.group;
        card.innerHTML = `
          <div class="layer-head">
            <div class="layer-title">
              <h2>${layer.name}</h2>
              <span class="layer-note">${layer.note}</span>
            </div>
          </div>
          <div class="board-scroll"><div class="board"></div></div>
        `;

        const board = card.querySelector(".board");
        layer.keys.forEach(([primary, hint = "", kind = ""], index) => {
          const position = positions[index];
          const key = document.createElement("div");
          key.className = `key ${kind}`;
          key.style.gridColumn = `${position.x + 1} / span 1`;
          key.style.gridRow = `${position.y + 1} / span 1`;
          key.title = hint ? `${primary} / ${hint}` : primary;
          key.innerHTML = `<span class="primary"></span><span class="secondary"></span>`;
          renderLabel(key.querySelector(".primary"), primary);
          renderHint(key.querySelector(".secondary"), hint);
          board.append(key);
        });

        layersContainer.append(card);
      }
    }

    function setPressed(selector, value) {
      document.querySelectorAll(selector).forEach((button) => {
        const pressed = button.dataset.filter === value || button.dataset.density === value || button.dataset.trans === value;
        button.setAttribute("aria-pressed", String(pressed));
      });
    }

    document.querySelectorAll("[data-filter]").forEach((button) => {
      button.addEventListener("click", () => {
        const filter = button.dataset.filter;
        setPressed("[data-filter]", filter);
        document.querySelectorAll(".layer-card").forEach((card) => {
          card.classList.toggle("is-hidden", filter !== "all" && card.dataset.group !== filter);
        });
      });
    });

    document.querySelectorAll("[data-density]").forEach((button) => {
      button.addEventListener("click", () => {
        const density = button.dataset.density;
        setPressed("[data-density]", density);
        app.classList.toggle("wide", density === "wide");
      });
    });

    document.querySelectorAll("[data-trans]").forEach((button) => {
      button.addEventListener("click", () => {
        const trans = button.dataset.trans;
        setPressed("[data-trans]", trans);
        app.classList.toggle("hide-transparent", trans === "hide");
      });
    });

    render();
  </script>
</body>
</html>
